<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10D Menu Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f6f3eb]">
  <div id="root"></div>

  <script type="text/babel">
  const { useState, useMemo, useRef, useEffect } = React;

  const MENU_LINK = "https://airmenus.in/10DS/kolkata/Dine-In/Pub%20%20Lunch%20%20Combos%20%20%20%20%20%20%20%2812%20pm%20To%204%20pm%29?sId=703951";

  const DISHES_WITH_INCLUDED_SIDES = [
    "Au Gratin with Garlic Toast",
    "Veg Shashlik with Rice",
    "Chicken Shashlik with Rice",
    "Fried Chicken & Chips",
    "Lemon Grilled Fish with Butter Rice",
    "Fried Fish & Chips",
    "Grill Fish with Garlic Toast",
    "Veg Triple Schezwan Rice",
    "Chicken Triple Sichuan Rice"
  ];

  const MENU = {
    "Veg|Indian": { mains: ["Dal Fry","Dal Makhni","Dal Tadka","Aloo Jeera","Tawa Veg","Paneer Butter Masala","Paneer Tikka Masala","Palak Paneer","Kadai Paneer","Hing Aloo Dum","Khoya Matar Paneer","Veg Biryani"], sides: ["None / Included with dish","Roti","Kulcha","Naan","Steamed Rice","Jeera Rice","Butter Roti","Cheese Garlic Naan"] },
    "Veg|Continental": { mains: ["Au Gratin with Garlic Toast","Cottage Cheese Steak","Corn and Mushroom Lasagne","Mushroom Corn Stroganoff","Pasta- Penne Alfredo","Pasta- Penne Arrabiata","Pasta- Penne Basil Pesto","Pasta- Spaghetti Arrabiata","Pasta- Spaghetti Aglio E Olio","Veg Shashlik with Rice","Spinach Corn Lasagne","Choice of Veg Risotto"], sides: ["None / Included with dish","Garlic Toast","Rice"] },
    "Veg|Chinese": { mains: ["Chilly Paneer Gravy","Babycorn & Mushroom in Soya Garlic Sauce","Crispy Potato with Choice of Sauce","Crispy Vegetables with Kung Pao sauce","Crispy Vegetables with Schezwan sauce","Stir-Fried Vegetables","Thai Curry Green","Thai Curry Red","Veg Triple Schezwan Rice"], sides: ["None / Included with dish","Garlic Rice","Garlic Noodles","Schezwan Rice","Schezwan Noodles","Mushroom Rice","Mushroom Noodles","Shanghai Rice","Shanghai Noodles","Crispy Chilli Coriander Rice","Crispy Chilli Coriander Noodles","Chilli Garlic Rice","Chilli Garlic Noodles","Hakka Noodles","Veg Fried Rice","Steamed Rice"] },
    "Non-Veg (Chicken)|Indian": { mains: ["Butter Chicken","Chicken Tikka Masala","Kadai Chicken","Punjabi Chicken","Chicken Ghee Roast","Nawabi Chicken","Peshawari Chicken","Chicken Mughlai","Chicken Curry","Chicken Biryani"], sides: ["None / Included with dish","Roti","Kulcha","Naan","Steamed Rice","Jeera Rice","Butter Roti","Cheese Garlic Naan"] },
    "Non-Veg (Chicken)|Continental": { mains: ["Chicken Pepper Steak","BBQ Chicken","Chicken Cheese Lasagne","Chicken Shashlik with Rice","Chicken Stronganoff","Pasta- Spaghetti Arrabiata","Pasta- Spaghetti Aglio E Olio","Pasta- Penne Alfredo","Pasta- Penne Arrabbiata","Pasta- Penne Basil Pesto","Spicy Grilled Chicken Lasagne","Chicken Supreme Risotto","Fried Chicken & Chips"], sides: ["None / Included with dish","Rice","Chips"] },
    "Non-Veg (Chicken)|Chinese": { mains: ["Thai Curry Green Chicken","Kung Pao Chicken","Chilli Chicken","Shanghai Chicken","Lemon Garlic Chicken","Pepper Sauce Chicken","Thai Curry Red Chicken","Stir Fried Chicken with Baby Corn & Mushroom","Roast Chicken in Red Chili Sauce","Shredded Chicken with Red Pepper","Schezwan Chicken","Chicken Triple Sichuan Rice"], sides: ["None / Included with dish","Chicken Garlic Rice","Chicken Garlic Noodles","Chicken Schezwan Rice","Chicken Schezwan Noodles","Chicken Mushroom Rice","Chicken Mushroom Noodles","Chicken Shanghai Rice","Chicken Shanghai Noodles","Chicken Crispy Chilli Coriander Rice","Chicken Crispy Chilli Coriander Noodles","Chicken Chilli Garlic Rice","Chicken Chilli Garlic Noodles","Chicken Hakka Noodles","Chicken Fried Rice"] },
    "Non-Veg (Mutton)|Indian": { mains: ["Mutton Rogan Josh","Rarra Masala","Dum ka Mutton","Laal Maas","Keema Hari Mirch Do Pyaza","Mutton Biryani"], sides: ["None / Included with dish","Roti","Kulcha","Naan","Steamed Rice","Jeera Rice","Butter Roti","Cheese Garlic Naan"] },
    "Non-Veg (Fish)|Continental": { mains: ["Lemon Grilled Fish with Butter Rice","Fried Fish & Chips","Grill Fish with Garlic Toast"], sides: ["None / Included with dish","Butter Rice","Chips","Garlic Toast"] },
    "Non-Veg (Fish)|Chinese": { mains: ["Thai Curry Green Fish","Kung Pao Fish","Chilli Fish","Shanghai Fish","Lemon Garlic Fish","Pepper Sauce Fish","Thai Curry Red Fish"], sides: ["None / Included with dish","Garlic Rice","Garlic Noodles","Schezwan Rice","Schezwan Noodles","Hakka Noodles","Steamed Rice"] },
    "Non-Veg (Prawn)|Indian": { mains: ["Malabar Prawns","Prawns Curry"], sides: ["None / Included with dish","Roti","Kulcha","Naan","Steamed Rice","Jeera Rice","Butter Roti","Cheese Garlic Naan"] },
    "Non-Veg (Prawn)|Chinese": { mains: ["Thai Curry Green Prawns","Kung Pao Prawn","Chilli Prawn","Shanghai Prawn","Lemon Garlic Prawn","Pepper Sauce Prawns","Thai Curry Red Prawns"], sides: ["None / Included with dish","Garlic Rice","Garlic Noodles","Schezwan Rice","Schezwan Noodles","Hakka Noodles","Steamed Rice"] },
    "Non-Veg (Lamb)|Continental": { mains: ["Pasta- Spaghetti Bolognese","Shepherd’s Pie","Lamb Steak","Roast Lamb","Lamb Bourguignon"], sides: ["None / Included with dish","Garlic Toast","Rice","Chips","Butter Rice"] },
    "Non-Veg (Egg)|Chinese": { mains: ["Egg Curry Chinese Style / Egg Gravy Platter"], sides: ["Egg Garlic Rice","Egg Garlic Noodles","Egg Schezwan Rice","Egg Schezwan Noodles","Egg Mushroom Rice","Egg Mushroom Noodles","Egg Shanghai Rice","Egg Shanghai Noodles","Egg Crispy Chilli Coriander Rice","Egg Crispy Chilli Coriander Noodles","Egg Chilli Garlic Rice","Egg Chilli Garlic Noodles","Egg Hakka Noodles"] }
  };

  const DIETS = ["Veg","Non-Veg (Chicken)","Non-Veg (Mutton)","Non-Veg (Fish)","Non-Veg (Prawn)","Non-Veg (Lamb)","Non-Veg (Egg)"];
  const CUISINES = {
    "Veg": ["Indian","Continental","Chinese"],
    "Non-Veg (Chicken)": ["Indian","Continental","Chinese"],
    "Non-Veg (Mutton)": ["Indian"],
    "Non-Veg (Fish)": ["Continental","Chinese"],
    "Non-Veg (Prawn)": ["Indian","Chinese"],
    "Non-Veg (Lamb)": ["Continental"],
    "Non-Veg (Egg)": ["Chinese"]
  };

  const DRINKS = ["Beer","Blue Lagoon","Virgin Mojito","Fresh Lime Soda Sweet","Fresh Lime Soda Salty","Fresh Lime Soda Mix","Cold Drink"];
  const DESSERTS = ["Gulab jamun","Ice cream"];

  const blank = { name:"", diet:"", cuisine:"", main:"", side:"", drink:"", dessert:"" };

  // Searchable Dropdown Component for Mobile and Desktop
  function SearchableSelect({ label, placeholder, options, value, onChange, isRequired, helperText }) {
    const [open, setOpen] = useState(false);
    const [search, setSearch] = useState("");
    const ref = useRef(null);

    useEffect(() => {
      function handleClickOutside(e) {
        if (ref.current && !ref.current.contains(e.target)) {
          setOpen(false);
        }
      }
      document.addEventListener("mousedown", handleClickOutside);
      return () => document.removeEventListener("mousedown", handleClickOutside);
    }, []);

    const filtered = options.filter(opt => 
      opt.toLowerCase().includes(search.toLowerCase())
    );

    return (
      <div className="relative" ref={ref}>
        <label className="block text-sm font-bold text-slate-800">
          {label} {isRequired && <span className="text-red-600">*</span>}
        </label>
        {helperText && <p className="text-xs text-slate-500 mt-0.5">{helperText}</p>}
        
        <button
          type="button"
          onClick={() => setOpen(!open)}
          className={`mt-1.5 flex w-full items-center justify-between rounded-xl border bg-white px-4 py-3 text-left transition ${
            open ? "border-emerald-600 ring-2 ring-emerald-100" : "border-slate-300 hover:border-slate-400"
          }`}
        >
          <span className={value ? "text-slate-900 font-medium truncate" : "text-slate-400"}>
            {value || placeholder}
          </span>
          <span className="text-xs text-slate-400 ml-2">▼</span>
        </button>

        {open && (
          <div className="absolute z-30 mt-1 max-h-64 w-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl">
            <div className="border-b border-slate-100 p-2">
              <input
                type="text"
                autoFocus
                placeholder="Type to filter..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full rounded-lg bg-slate-50 px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500"
              />
            </div>
            <div className="max-h-48 overflow-y-auto p-1 text-sm">
              <div
                onClick={() => { onChange(""); setOpen(false); setSearch(""); }}
                className="cursor-pointer rounded-lg px-3 py-2 text-slate-400 hover:bg-slate-100"
              >
                -- None / Clear Selection --
              </div>
              {filtered.length > 0 ? (
                filtered.map(item => (
                  <div
                    key={item}
                    onClick={() => { onChange(item); setOpen(false); setSearch(""); }}
                    className={`cursor-pointer rounded-lg px-3 py-2 transition ${
                      value === item ? "bg-emerald-50 font-bold text-emerald-800" : "text-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    {item}
                  </div>
                ))
              ) : (
                <div className="px-3 py-2 text-center text-xs text-slate-400">No matching items</div>
              )}
            </div>
          </div>
        )}
      </div>
    );
  }

  function App() {
    const [step, setStep] = useState(1);
    const [form, setForm] = useState(blank);
    const [submitted, setSubmitted] = useState(false);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState("");
    const [showSummaryModal, setShowSummaryModal] = useState(false);
    const sheetEndpoint = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

    const cuisines = CUISINES[form.diet] || [];
    const isSingleCuisine = cuisines.length === 1;
    const chosenMenu = useMemo(() => MENU[`${form.diet}|${form.cuisine}`], [form.diet, form.cuisine]);
    const egg = form.diet === "Non-Veg (Egg)";

    const hasIncludedSide = useMemo(() => {
      return form.main && DISHES_WITH_INCLUDED_SIDES.includes(form.main);
    }, [form.main]);

    function updateField(field, value) {
      if (error) setError("");
      setForm(prev => ({ ...prev, [field]: value }));
    }

    function chooseDiet(diet) {
      if (error) setError("");
      const available = CUISINES[diet] || [];
      setForm({
        ...form,
        diet,
        cuisine: available.length === 1 ? available[0] : "",
        main: "",
        side: "",
        drink: "",
        dessert: ""
      });
    }

    function next() {
      setError("");
      if (step === 1) {
        if (!form.name.trim() || !form.diet) return setError("Enter your name and select a dietary preference.");
        setStep(isSingleCuisine ? 3 : 2);
        return;
      }
      if (step === 2) {
        if (!form.cuisine) return setError("Select a cuisine.");
        setStep(3);
      }
    }

    function back() {
      setError("");
      if (step === 3 && isSingleCuisine) {
        setStep(1);
      } else {
        setStep(step - 1);
      }
    }

    function handlePreSubmitValidation(e) {
      e.preventDefault();
      setError("");

      if (egg && !form.main && !form.side) {
        return setError("Please select at least a main dish or a side dish.");
      }
      if (!egg && !form.main) {
        return setError("Select a main dish.");
      }

      setShowSummaryModal(true);
    }

    async function confirmAndSubmit() {
      setShowSummaryModal(false);
      setBusy(true);

      const row = {
        action: "upsert",
        timestamp: new Date().toISOString(),
        attendeeName: form.name.trim(),
        attendeeKey: form.name.trim().replace(/\s+/g, " ").toLowerCase(),
        dietaryPreference: form.diet,
        cuisine: form.cuisine,
        mainDish: form.main || "None",
        sideDish: form.side || "None / Included with dish",
        drink: form.drink || "None",
        dessert: form.dessert || "None"
      };

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(sheetEndpoint, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(row),
          signal: controller.signal,
          redirect: "follow"
        });

        if (!response.ok) throw new Error("Google Sheet rejected the submission.");
        const result = await response.json();
        
        if (result?.success !== true) {
          throw new Error(result?.message || "Google Sheet did not confirm entry creation.");
        }
        setSubmitted(true);
      } catch (err) {
        setError(err.name === "AbortError" ? "Request timed out. Please check your connection." : (err.message || "Submission failed."));
      } finally {
        window.clearTimeout(timeoutId);
        setBusy(false);
      }
    }

    const Choice = ({ value, selected, onClick }) => (
      <button 
        type="button" 
        onClick={onClick} 
        className={`w-full text-left rounded-2xl border px-4 py-3 transition ${
          selected ? "border-emerald-600 bg-emerald-50 text-emerald-900 ring-2 ring-emerald-100" : "border-slate-200 bg-white hover:border-emerald-300"
        }`}
      >
        {value}
      </button>
    );

    return (
      <main className="min-h-screen bg-[#f6f3eb] text-slate-900 px-4 py-8 sm:py-12">
        <div className="mx-auto max-w-2xl">
          <header className="mb-6">
            <p className="text-xs font-bold uppercase tracking-[0.22em] text-emerald-700">Durga Puja Lunch Pre-Order</p>
            <h1 className="mt-2 text-4xl font-black tracking-tight sm:text-5xl">10D Menu Tracker</h1>
            <p className="mt-3 text-slate-600">Choose your preference, cuisine, dish, side, drink, and dessert.</p>
            
            <div className="mt-4 flex items-center justify-between rounded-xl border border-emerald-200 bg-emerald-50/70 px-4 py-2.5 text-xs sm:text-sm">
              <span className="font-semibold text-emerald-900">Want to inspect items & combos first?</span>
              <a 
                href={MENU_LINK} 
                target="_blank" 
                rel="noopener noreferrer" 
                className="inline-flex items-center gap-1 font-bold text-emerald-700 underline hover:text-emerald-900"
              >
                View AirMenus ↗
              </a>
            </div>
          </header>

          <div className="mb-4 grid grid-cols-3 gap-2">
            {["Attendee", "Cuisine", "Menu"].map((label, i) => (
              <div key={label}>
                <div className={`h-2 rounded-full ${step >= i + 1 ? "bg-emerald-600" : "bg-slate-200"}`} />
                <p className={`mt-2 text-xs font-semibold ${step === i + 1 ? "text-emerald-700" : "text-slate-500"}`}>{i + 1}. {label}</p>
              </div>
            ))}
          </div>

          <section className="rounded-[28px] border border-white bg-white/90 p-6 shadow-xl shadow-slate-200/60 sm:p-8">
            {submitted ? (
              <div className="py-8 text-center">
                <div className="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-full bg-emerald-100 text-3xl text-emerald-700">
                  ✓
                </div>
                <h2 className="text-2xl font-bold">Selection recorded!</h2>
                <p className="mt-2 text-slate-600">
                  Thanks <span className="font-semibold text-slate-900">{form.name}</span>, your lunch combo has been confirmed.
                </p>

                <div className="mt-6 rounded-2xl bg-slate-50 p-5 text-left text-sm space-y-1.5 border border-slate-200">
                  <p className="text-xs uppercase font-bold tracking-wider text-slate-400 mb-2">Your Order Summary</p>
                  <p><b>Diet & Cuisine:</b> {form.diet} · {form.cuisine}</p>
                  <p><b>Main:</b> {form.main || "None"}</p>
                  <p><b>Side:</b> {form.side || "None / Included with dish"}</p>
                  <p><b>Drink:</b> {form.drink || "None"}</p>
                  <p><b>Dessert:</b> {form.dessert || "None"}</p>
                </div>

                <div className="mt-6 flex flex-col items-center gap-3">
                  <button 
                    onClick={() => { setSubmitted(false); setStep(3); }} 
                    className="w-full rounded-xl bg-emerald-700 px-4 py-3.5 font-bold text-white shadow-sm hover:bg-emerald-800 transition"
                  >
                    Edit my selection
                  </button>

                  <button 
                    onClick={() => { setForm(blank); setStep(1); setSubmitted(false); setError(""); }} 
                    className="text-xs font-semibold text-slate-500 hover:text-slate-700 underline mt-1"
                  >
                    Clear and start over
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handlePreSubmitValidation}>
                {step === 1 && (
                  <div>
                    <h2 className="text-2xl font-bold">Who is ordering?</h2>
                    <label className="mt-6 block text-sm font-bold">Attendee Name <span className="text-red-600">*</span></label>
                    <input 
                      value={form.name} 
                      onChange={e => updateField("name", e.target.value)} 
                      placeholder="Enter full name" 
                      className="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100" 
                    />
                    <p className="mt-6 text-sm font-bold">Dietary Preference <span className="text-red-600">*</span></p>
                    <div className="mt-2 grid gap-2 sm:grid-cols-2">
                      {DIETS.map(d => <Choice key={d} value={d} selected={form.diet === d} onClick={() => chooseDiet(d)} />)}
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div>
                    <p className="text-sm font-bold text-emerald-700">{form.diet}</p>
                    <h2 className="mt-1 text-2xl font-bold">Select cuisine</h2>
                    <div className="mt-6 grid gap-3">
                      {cuisines.map(c => (
                        <Choice 
                          key={c} 
                          value={c} 
                          selected={form.cuisine === c} 
                          onClick={() => {
                            if (error) setError("");
                            setForm({ ...form, cuisine: c, main: "", side: "", drink: "", dessert: "" });
                          }} 
                        />
                      ))}
                    </div>
                  </div>
                )}

                {step === 3 && chosenMenu && (
                  <div className="space-y-5">
                    {/* Header + External Link Button */}
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <h2 className="text-2xl font-bold">Build your menu</h2>
                        <p className="text-xs text-slate-500 mt-0.5">Customize your combo selections</p>
                      </div>
                      <a 
                        href={MENU_LINK} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="inline-flex shrink-0 items-center gap-1 rounded-lg border border-emerald-300 bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-800 hover:bg-emerald-100"
                      >
                        Menu Card ↗
                      </a>
                    </div>

                    {/* Progressive Live Selection Strip */}
                    <div className="flex flex-wrap items-center gap-1.5 rounded-2xl bg-slate-100/80 p-3 text-xs">
                      <span className="font-bold text-slate-500 uppercase tracking-wide mr-1">Your Combo:</span>
                      <span className="rounded-md bg-white px-2.5 py-1 font-semibold text-slate-800 shadow-sm border border-slate-200">
                        👤 {form.name || "Attendee"}
                      </span>
                      <span className="rounded-md bg-emerald-100/80 px-2.5 py-1 font-semibold text-emerald-900 border border-emerald-200">
                        {form.diet}
                      </span>
                      <span className="rounded-md bg-emerald-100/80 px-2.5 py-1 font-semibold text-emerald-900 border border-emerald-200">
                        {form.cuisine}
                      </span>
                      {form.main && (
                        <span className="rounded-md bg-amber-50 px-2.5 py-1 font-semibold text-amber-900 border border-amber-200 truncate max-w-[200px]">
                          🍲 {form.main}
                        </span>
                      )}
                      {form.side && form.side !== "None / Included with dish" && (
                        <span className="rounded-md bg-amber-50 px-2.5 py-1 font-semibold text-amber-900 border border-amber-200 truncate max-w-[150px]">
                          🍚 {form.side}
                        </span>
                      )}
                    </div>

                    {/* Searchable Main Dish */}
                    <SearchableSelect
                      label="Main Dish"
                      placeholder={egg ? "No main dish (Optional)" : "-- Select or search a main dish --"}
                      options={chosenMenu.mains.filter(Boolean)}
                      value={form.main}
                      isRequired={!egg}
                      helperText={egg ? "Optional for Egg preference (select side below if skipping main)" : ""}
                      onChange={val => updateField("main", val)}
                    />

                    {/* Visual Included vs. Separate Helper Banner */}
                    {hasIncludedSide && (
                      <div className="rounded-xl border border-blue-200 bg-blue-50/70 p-3 text-xs text-blue-900 flex items-start gap-2">
                        <span className="text-base leading-none">ℹ️</span>
                        <div>
                          <p className="font-bold">Base side already included with this dish</p>
                          <p className="text-blue-700 mt-0.5">
                            "{form.main}" already comes with its side accompaniment. You can leave Side Dish empty or select "None" unless you need a different side.
                          </p>
                        </div>
                      </div>
                    )}

                    {/* Searchable Side Dish */}
                    <SearchableSelect
                      label="Side Dish"
                      placeholder={egg ? "-- Select rice / noodles --" : "None / Included with dish"}
                      options={chosenMenu.sides}
                      value={form.side}
                      isRequired={egg}
                      helperText={egg ? "Required if no curry is chosen" : "(optional)"}
                      onChange={val => updateField("side", val)}
                    />

                    {/* Drinks Dropdown */}
                    <div>
                      <label className="block text-sm font-bold text-slate-800">
                        Drinks <span className="font-normal text-slate-500">(optional)</span>
                      </label>
                      <select 
                        value={form.drink} 
                        onChange={e => updateField("drink", e.target.value)} 
                        className="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
                      >
                        <option value="">None</option>
                        {DRINKS.map(x => <option key={x} value={x}>{x}</option>)}
                      </select>
                    </div>

                    {/* Dessert Dropdown */}
                    <div>
                      <label className="block text-sm font-bold text-slate-800">
                        Dessert <span className="font-normal text-slate-500">(optional)</span>
                      </label>
                      <select 
                        value={form.dessert} 
                        onChange={e => updateField("dessert", e.target.value)} 
                        className="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
                      >
                        <option value="">None</option>
                        {DESSERTS.map(x => <option key={x} value={x}>{x}</option>)}
                      </select>
                    </div>
                  </div>
                )}

                {error && <p className="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{error}</p>}
                
                <div className="mt-7 flex gap-3">
                  {step > 1 && <button type="button" onClick={back} className="rounded-xl border border-slate-300 px-5 py-3 font-bold">Back</button>}
                  {step < 3 ? (
                    <button type="button" onClick={next} className="ml-auto rounded-xl bg-emerald-700 px-6 py-3 font-bold text-white hover:bg-emerald-800">Continue</button>
                  ) : (
                    <button type="submit" disabled={busy} className="ml-auto rounded-xl bg-emerald-700 px-6 py-3 font-bold text-white disabled:opacity-60 shadow-md hover:bg-emerald-800">
                      {busy ? "Saving..." : "Review & Submit"}
                    </button>
                  )}
                </div>
              </form>
            )}
          </section>

          {/* Pre-Submission Summary Confirmation Pop-Up Modal */}
          {showSummaryModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
              <div className="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl">
                <h3 className="text-xl font-bold text-slate-900">Confirm Your Order</h3>
                <p className="mt-1 text-xs text-slate-500">Please review your selections before we save it to the sheet.</p>

                <div className="mt-4 divide-y divide-slate-100 rounded-2xl bg-slate-50 p-4 text-sm">
                  <div className="pb-2">
                    <span className="text-xs font-bold text-slate-400 uppercase">Attendee</span>
                    <p className="font-semibold text-slate-800">{form.name}</p>
                  </div>
                  <div className="py-2">
                    <span className="text-xs font-bold text-slate-400 uppercase">Combo Category</span>
                    <p className="font-medium text-slate-800">{form.diet} · {form.cuisine}</p>
                  </div>
                  <div className="py-2">
                    <span className="text-xs font-bold text-slate-400 uppercase">Main Dish</span>
                    <p className="font-medium text-slate-800">{form.main || "None"}</p>
                  </div>
                  <div className="py-2">
                    <span className="text-xs font-bold text-slate-400 uppercase">Side Dish</span>
                    <p className="font-medium text-slate-800">{form.side || "None / Included with dish"}</p>
                  </div>
                  <div className="py-2">
                    <span className="text-xs font-bold text-slate-400 uppercase">Drink & Dessert</span>
                    <p className="font-medium text-slate-800">{form.drink || "No drink"} · {form.dessert || "No dessert"}</p>
                  </div>
                </div>

                <div className="mt-6 flex gap-3">
                  <button
                    type="button"
                    onClick={() => setShowSummaryModal(false)}
                    className="flex-1 rounded-xl border border-slate-300 py-3 font-semibold text-slate-700 hover:bg-slate-50"
                  >
                    Change
                  </button>
                  <button
                    type="button"
                    onClick={confirmAndSubmit}
                    className="flex-1 rounded-xl bg-emerald-700 py-3 font-bold text-white shadow-md hover:bg-emerald-800"
                  >
                    Confirm & Submit
                  </button>
                </div>
              </div>
            </div>
          )}

          <p className="mt-4 text-center text-xs text-slate-500">No account or app download required.</p>
        </div>
      </main>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
